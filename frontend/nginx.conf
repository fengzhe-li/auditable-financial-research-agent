server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Same relative /api path the Vite dev proxy uses (see vite.config.ts) -
    # frontend code never needs to know whether it's talking to the dev
    # server's proxy or this one.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
