<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 900" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6270"/>
    </marker>
  </defs>
  <style>
    .box { stroke-width: 1.5; rx: 8; }
    .neutral { fill: #eceef1; stroke: #c7cbd1; }
    .accent { fill: #eaf0fd; stroke: #1f4faa; }
    .ok { fill: #e4f5ec; stroke: #1a7f4b; }
    .warn { fill: #fdf1dc; stroke: #92600a; }
    .label { font-size: 13px; font-weight: 700; fill: #1a1d23; }
    .sub { font-size: 10.5px; fill: #5b6270; }
    .phase { font-size: 9.5px; fill: #8890a0; font-style: italic; }
    .edge { stroke: #5b6270; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .section { font-size: 11px; font-weight: 700; fill: #8890a0; letter-spacing: 0.5px; }
  </style>

  <rect x="0" y="0" width="980" height="900" fill="#f4f5f7"/>

  <!-- Frontend -->
  <rect class="box accent" x="330" y="20" width="320" height="60"/>
  <text class="label" x="490" y="45" text-anchor="middle">Research Assurance Console</text>
  <text class="sub" x="490" y="62" text-anchor="middle">React + TypeScript + Vite</text>
  <text class="phase" x="490" y="76" text-anchor="middle">Phase 7</text>

  <line class="edge" x1="490" y1="80" x2="490" y2="120"/>
  <text class="sub" x="505" y="104" text-anchor="start">REST / HTTP</text>

  <!-- API layer -->
  <rect class="box accent" x="365" y="120" width="250" height="50"/>
  <text class="label" x="490" y="145" text-anchor="middle">FastAPI API Layer</text>
  <text class="sub" x="490" y="161" text-anchor="middle">no business logic - read + 3 review actions</text>

  <line class="edge" x1="490" y1="170" x2="490" y2="205"/>

  <!-- Orchestrator -->
  <rect class="box neutral" x="340" y="205" width="300" height="55"/>
  <text class="label" x="490" y="230" text-anchor="middle">Task Orchestrator</text>
  <text class="sub" x="490" y="247" text-anchor="middle">state-machine engine · Phase 1</text>

  <!-- 4 children -->
  <line class="edge" x1="420" y1="260" x2="140" y2="300"/>
  <line class="edge" x1="460" y1="260" x2="360" y2="300"/>
  <line class="edge" x1="520" y1="260" x2="620" y2="300"/>
  <line class="edge" x1="560" y1="260" x2="840" y2="300"/>

  <rect class="box neutral" x="30" y="300" width="220" height="55"/>
  <text class="label" x="140" y="323" text-anchor="middle">Research Planner</text>
  <text class="phase" x="140" y="340" text-anchor="middle">Phase 2</text>

  <rect class="box neutral" x="260" y="300" width="200" height="55"/>
  <text class="label" x="360" y="323" text-anchor="middle">Controlled Tool Layer</text>
  <text class="phase" x="360" y="340" text-anchor="middle">Phase 2 · search/get/retrieve</text>

  <rect class="box neutral" x="510" y="300" width="220" height="55"/>
  <text class="label" x="620" y="323" text-anchor="middle">Claim / Validation Engine</text>
  <text class="phase" x="620" y="340" text-anchor="middle">Phase 3</text>

  <rect class="box neutral" x="730" y="300" width="220" height="55"/>
  <text class="label" x="840" y="318" text-anchor="middle">Data Classification &amp;</text>
  <text class="label" x="840" y="334" text-anchor="middle">Model Routing Policy</text>
  <text class="phase" x="840" y="349" text-anchor="middle">Phase 4</text>

  <!-- Evidence store -->
  <line class="edge" x1="360" y1="355" x2="360" y2="395"/>
  <rect class="box neutral" x="260" y="395" width="200" height="45"/>
  <text class="label" x="360" y="422" text-anchor="middle">Evidence Store</text>

  <line class="edge" x1="460" y1="417" x2="620" y2="355" />
  <line class="edge" x1="840" y1="355" x2="840" y2="395"/>
  <rect class="box neutral" x="730" y="395" width="220" height="45"/>
  <text class="label" x="840" y="422" text-anchor="middle">DLP / Security Policy</text>

  <!-- Model provider abstraction -->
  <line class="edge" x1="360" y1="440" x2="490" y2="480"/>
  <line class="edge" x1="840" y1="440" x2="600" y2="480"/>
  <rect class="box accent" x="380" y="480" width="240" height="45"/>
  <text class="label" x="500" y="507" text-anchor="middle">Model Provider Abstraction</text>

  <line class="edge" x1="440" y1="525" x2="220" y2="570"/>
  <line class="edge" x1="500" y1="525" x2="500" y2="570"/>
  <line class="edge" x1="560" y1="525" x2="780" y2="570"/>

  <rect class="box ok" x="60" y="570" width="320" height="55"/>
  <text class="label" x="220" y="593" text-anchor="middle">3 deterministic test-double providers</text>
  <text class="sub" x="220" y="610" text-anchor="middle">every test &amp; the seeded demo use only these</text>

  <rect class="box warn" x="400" y="570" width="200" height="55"/>
  <text class="label" x="500" y="593" text-anchor="middle">Real drafting adapters</text>
  <text class="sub" x="500" y="610" text-anchor="middle">Gemini · Antigravity CLI · 6.5</text>

  <rect class="box neutral" x="620" y="570" width="320" height="55"/>
  <text class="label" x="780" y="593" text-anchor="middle">Self-hosted / enterprise adapters</text>
  <text class="sub" x="780" y="610" text-anchor="middle">not built - abstraction point only</text>

  <!-- Review + Audit spanning bars -->
  <line class="edge" x1="490" y1="260" x2="490" y2="660" stroke-dasharray="3,3"/>
  <rect class="box neutral" x="60" y="660" width="880" height="50"/>
  <text class="label" x="500" y="690" text-anchor="middle">Review / Approval Service - separation of duties, stale-approval detection, publication gate (Phase 5)</text>

  <rect class="box neutral" x="60" y="725" width="880" height="50"/>
  <text class="label" x="500" y="755" text-anchor="middle">Audit Trace Store - ModelCall / ToolCall / StateTransition / SecurityEvent, cross-cutting since Phase 1</text>

  <!-- Legend -->
  <text class="section" x="60" y="810">LEGEND</text>
  <rect class="box accent" x="60" y="822" width="18" height="14"/>
  <text class="sub" x="86" y="834">In active use (frontend, API, providers)</text>
  <rect class="box neutral" x="60" y="844" width="18" height="14"/>
  <text class="sub" x="86" y="856">Core backend, Phases 1-5</text>
  <rect class="box warn" x="60" y="866" width="18" height="14"/>
  <text class="sub" x="86" y="878">Real-model adapters, claim drafting only (Phase 6.5 live run)</text>
</svg>
