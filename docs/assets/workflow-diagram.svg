<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6270"/>
    </marker>
    <marker id="arrowDanger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3231f"/>
    </marker>
  </defs>
  <style>
    .box { stroke-width: 1.5; }
    .neutral { fill: #eceef1; stroke: #9199a6; }
    .accent { fill: #eaf0fd; stroke: #1f4faa; }
    .ok { fill: #e4f5ec; stroke: #1a7f4b; }
    .warn { fill: #fdf1dc; stroke: #92600a; }
    .danger { fill: #fbe7e6; stroke: #a3231f; }
    .label { font-size: 12px; font-weight: 700; fill: #1a1d23; text-anchor: middle; }
    .cond { font-size: 9.5px; fill: #5b6270; }
    .edge { stroke: #5b6270; stroke-width: 1.4; fill: none; marker-end: url(#arrow2); }
    .edgeDanger { stroke: #a3231f; stroke-width: 1.3; fill: none; marker-end: url(#arrowDanger); stroke-dasharray: 4,3; }
    .edgeLoop { stroke: #5b6270; stroke-width: 1.3; fill: none; marker-end: url(#arrow2); stroke-dasharray: 2,3; }
  </style>

  <rect x="0" y="0" width="1300" height="640" fill="#f4f5f7"/>
  <text x="20" y="26" font-size="13" font-weight="700" fill="#1a1d23">ResearchTask state machine - only states a task actually reached are ever shown in the console (docs/STATE_MACHINE.md)</text>

  <!-- ROW 1: main happy path, y=70-116 -->
  <rect class="box neutral" x="20" y="70" width="130" height="46"/>
  <text class="label" x="85" y="98">CREATED</text>

  <line class="edge" x1="150" y1="93" x2="185" y2="93"/>
  <rect class="box neutral" x="185" y="70" width="130" height="46"/>
  <text class="label" x="250" y="98">PLANNING</text>

  <line class="edge" x1="315" y1="93" x2="350" y2="93"/>
  <rect class="box neutral" x="350" y="70" width="165" height="46"/>
  <text class="label" x="432" y="98">GATHERING_EVIDENCE</text>

  <line class="edge" x1="515" y1="93" x2="550" y2="93"/>
  <rect class="box neutral" x="550" y="70" width="135" height="46"/>
  <text class="label" x="617" y="98">SYNTHESISING</text>

  <line class="edge" x1="685" y1="93" x2="720" y2="93"/>
  <rect class="box neutral" x="720" y="70" width="125" height="46"/>
  <text class="label" x="782" y="98">VALIDATING</text>

  <line class="edge" x1="845" y1="93" x2="880" y2="93"/>
  <rect class="box accent" x="880" y="70" width="155" height="46"/>
  <text class="label" x="957" y="98">AWAITING_REVIEW</text>

  <line class="edgeDanger" x1="1035" y1="93" x2="1070" y2="93"/>
  <text class="cond" x="1038" y="83">reject</text>
  <rect class="box danger" x="1070" y="70" width="130" height="46"/>
  <text class="label" x="1135" y="98">REJECTED</text>

  <!-- ROW 2: y=175-221, one branch below each relevant row-1 box -->
  <line class="edge" x1="250" y1="116" x2="250" y2="175"/>
  <text class="cond" x="150" y="150">scope ambiguous / missing</text>
  <rect class="box warn" x="170" y="175" width="160" height="46"/>
  <text class="label" x="250" y="203">NEEDS_CLARIFICATION</text>
  <path class="edgeLoop" d="M 240 175 C 235 150, 240 130, 245 116"/>
  <text class="cond" x="20" y="235">submit_clarification_answer() resumes the same task</text>

  <line class="edgeDanger" x1="432" y1="116" x2="432" y2="175"/>
  <text class="cond" x="370" y="150">tool layer exhausts retries</text>
  <rect class="box danger" x="360" y="175" width="140" height="46"/>
  <text class="label" x="430" y="203">FAILED</text>

  <line class="edgeDanger" x1="617" y1="116" x2="617" y2="175"/>
  <text class="cond" x="518" y="145">RESTRICTED, or no eligible</text>
  <text class="cond" x="518" y="157">provider, before model call</text>
  <rect class="box danger" x="530" y="175" width="175" height="46"/>
  <text class="label" x="617" y="203">SECURITY_BLOCKED</text>

  <line class="edge" x1="782" y1="116" x2="782" y2="175"/>
  <text class="cond" x="720" y="150">no / conflicting / one-sided evidence</text>
  <rect class="box warn" x="700" y="175" width="175" height="46"/>
  <text class="label" x="787" y="203">INSUFFICIENT_EVIDENCE</text>

  <line class="edge" x1="957" y1="116" x2="957" y2="175"/>
  <text class="cond" x="965" y="150">approve</text>
  <rect class="box ok" x="880" y="175" width="155" height="46"/>
  <text class="label" x="957" y="203">APPROVED</text>

  <line class="edge" x1="1135" y1="116" x2="1135" y2="175"/>
  <text class="cond" x="1090" y="150">request_revision</text>
  <rect class="box warn" x="1070" y="175" width="130" height="46"/>
  <text class="label" x="1135" y="197">REVISION_</text>
  <text class="label" x="1135" y="211">REQUESTED</text>

  <!-- ROW 3: PUBLISHED under APPROVED -->
  <line class="edge" x1="957" y1="221" x2="957" y2="290"/>
  <text class="cond" x="800" y="260">publish() - publication gate re-checked</text>
  <rect class="box ok" x="880" y="290" width="155" height="46"/>
  <text class="label" x="957" y="318">PUBLISHED</text>

  <!-- revision loop-back, routed entirely through open space (right of REVISION_REQUESTED,
       below every row-2 box, back in via GATHERING_EVIDENCE's left edge) so it never
       crosses another box -->
  <path class="edgeLoop" d="M 1070 198 L 1250 198 L 1250 460 L 340 460 L 340 93 L 350 93"/>
  <text class="cond" x="380" y="478">resume_from_revision() - same task_id; existing evidence &amp; prior claims retained either way</text>
  <text class="cond" x="380" y="492">(GATHERING_EVIDENCE if new evidence is needed, SYNTHESISING otherwise - both loop back into this same graph)</text>

  <!-- legend -->
  <g transform="translate(20,520)">
    <rect class="box neutral" x="0" y="0" width="16" height="14"/><text class="cond" x="22" y="12">in progress</text>
    <rect class="box accent" x="150" y="0" width="16" height="14"/><text class="cond" x="172" y="12">awaiting a human decision</text>
    <rect class="box ok" x="380" y="0" width="16" height="14"/><text class="cond" x="402" y="12">approved / published</text>
    <rect class="box warn" x="560" y="0" width="16" height="14"/><text class="cond" x="582" y="12">paused / abstained - resumable or gated</text>
    <rect class="box danger" x="880" y="0" width="16" height="14"/><text class="cond" x="902" y="12">terminal, unsupported/blocked/failed - never publishable</text>
  </g>
  <text x="20" y="565" font-size="10.5" fill="#8890a0">Every arrow above is a real, code-enforced transition (afra.orchestrator.orchestrator) - the Task Detail page's "Workflow / State Timeline" renders only the subset of this graph one specific task actually traversed.</text>
  <text x="20" y="582" font-size="10.5" fill="#8890a0">Not shown: resolve_security_event() records governance sign-off on a require_approval event for the audit trail, but never revives a SECURITY_BLOCKED task - no live path leaves that state.</text>
</svg>
